<text x="650" y="142" text-anchor="middle" font-weight="700">XNET Write</text>
<text x="650" y="160" text-anchor="middle">Signal Single-Point</text>
<text x="542" y="186">session in</text><text x="542" y="206">data</text><text x="710" y="186">session out</text>
