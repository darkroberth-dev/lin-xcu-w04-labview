<text x="542" y="336">session in</text><text x="730" y="336">data</text><text x="700" y="360">session out</text>
<rect x="820" y="318" width="140" height="28" fill="#f8d7a4" stroke="#111" stroke-width="2"/><text x="890" y="337" text-anchor="middle" font-weight="700">DBL [36]</text>
