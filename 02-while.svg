<text x="38" y="380" font-weight="700">Ejemplo (DBL)</text>
<text x="38" y="398">ModeReq FL/FR = 2 (Mode 1)</text>
<text x="38" y="414">StrngReq FL/FR = 3 (Mid)</text>
<text x="38" y="430">MotEnb y SWEnb = 1</text>
<text x="38" y="446">AdjtReq = 0 (Nomal)</text>
