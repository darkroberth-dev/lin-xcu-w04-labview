</g>
<polyline points="166,678 200,678" fill="none" stroke="#6a45a4" stroke-width="3"/>
<polyline points="550,678 584,678" fill="none" stroke="#6a45a4" stroke-width="3"/>
<text x="16" y="748" font-family="Segoe UI,sans-serif" font-size="11">El orden del array TX es el mismo que el list de Create Session. El ciclo del schedule XCU_W04 es 60 ms; el Wait de 50 ms solo refresca el panel.</text>
